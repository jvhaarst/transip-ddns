name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/transip-ddns/**'
  workflow_dispatch:

permissions:
  # Read-only: the workflow no longer commits anything.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Download existing index (if exists)
        id: existing-index
        continue-on-error: true
        run: |
          curl -fsSL https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.yaml -o existing-index.yaml
          echo "exists=true" >> $GITHUB_OUTPUT

      # The published version is the chart's major.minor with the workflow run
      # number as the patch digit, which is what ntp_dashboard_k8s and
      # garmin_health_data_k8s already do. It means no step has to commit to
      # the default branch: the earlier auto-bump did, and with the
      # `main protection` ruleset in place that push is rejected with GH013,
      # because the ruleset bypasses the repository-admin role and not the
      # GitHub Actions app. It also raced with Renovate automerges, which
      # rejected it as non-fast-forward.
      #
      # Requiring a hand-written bump was the other candidate, but a Renovate
      # PR that updates an image tag in the chart's values.yaml automerges and
      # triggers this workflow without bumping anything, so each one would
      # leave a red release run on main.
      - name: Package Helm chart
        run: |
          set -euo pipefail
          mkdir -p .helm-release
          BASE_VERSION=$(yq '.version' charts/transip-ddns/Chart.yaml)
          NEW_VERSION="${BASE_VERSION%.*}.${{ github.run_number }}"
          echo "Publishing chart version ${NEW_VERSION} (Chart.yaml says ${BASE_VERSION})"
          helm package charts/transip-ddns -d .helm-release --version "${NEW_VERSION}"

      - name: Generate Helm repo index
        run: |
          cd .helm-release
          if [ -f ../existing-index.yaml ]; then
            helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} --merge ../existing-index.yaml
          else
            helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.helm-release'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
