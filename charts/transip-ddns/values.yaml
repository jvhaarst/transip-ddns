# TransIP Dynamic DNS Helm Chart Values

# Container image configuration
image:
  repository: ghcr.io/jvhaarst/transip-ddns
  tag: main
  pullPolicy: IfNotPresent

# Image pull secrets (if using private registry)
imagePullSecrets: []

# CronJob schedule (default: every 5 minutes)
schedule: "*/5 * * * *"

# Timezone for the CronJob (optional)
# timezone: "Europe/Amsterdam"

# Number of successful/failed jobs to keep
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 3

# Restart policy for the job
restartPolicy: OnFailure

# Script arguments (passed to transip-ddns.sh)
scriptArgs: "-s"

# TransIP Configuration
transip:
  # TransIP account name (required)
  accountName: ""

  # Private key - provide via existingSecret or create new secret
  privateKey:
    # Use existing secret (recommended for production)
    existingSecret: ""
    existingSecretKey: "transip.key"
    # Or provide key directly (will be stored in a new secret)
    # WARNING: Only use for testing, prefer existingSecret
    value: ""

# DNS Configuration
config:
  # Log file path inside container (optional, logs also go to stdout)
  logfile: ""

  # IP lookup providers
  ipLookupProviders:
    ipv4:
      - "https://ipv4.icanhazip.com/"
      - "https://api.ipify.org/"
    ipv6:
      - "https://ipv6.icanhazip.com/"
      - "https://api6.ipify.org/"

  # Domains to update (required)
  domains: []
  #  - example.com
  #  - example.org

  # Subdomains to update (required)
  # Use '@' for root domain
  subdomains:
    - "@"

  # Record types to update
  recordTypes:
    - A
    - AAAA

# Pod resource limits
resources: {}
#  limits:
#    cpu: 100m
#    memory: 128Mi
#  requests:
#    cpu: 50m
#    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}
#  fsGroup: 1000

# Container security context
securityContext: {}
#  runAsNonRoot: true
#  runAsUser: 1000

# Per-node AAAA records.
#
# A records are one shared WAN address, so the CronJob above can publish them
# from anywhere. AAAA cannot: the address comes from asking an external service
# what source address the connection came from, which returns the *host's* own
# address — and from the pod network there is no IPv6 route at all.
#
# Enabling this deploys a DaemonSet with hostNetwork alongside the CronJob. Each
# pod writes only the records its own node owns: $NODE_NAME from the downward
# API, plus any nodeAliases entries for it.
#
# Remove AAAA from config.recordTypes when enabling this, or rendering fails —
# two writers for the same name would fight.
nodeMode:
  enabled: false
  # The DaemonSet owns these; config.recordTypes stays with the CronJob.
  recordTypes:
    - AAAA
  # Extra record names a node owns beyond its own name, e.g. raspi5 also
  # answers for backup.vanhaarst.net.
  nodeAliases: {}
  #  raspi5:
  #    - backup
  # Seconds between runs. docker-entrypoint.sh loops on SCHEDULE_INTERVAL,
  # since a DaemonSet pod is long-lived rather than scheduled.
  interval: 900
  scriptArgs: "-s"
  nodeSelector: {}
  # Every node needs its own record, including tainted ones.
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
